[project]
name = "cadstack"
version = "0.2.0"
description = "CAD Automation Skill Pack for Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CADStack Contributors"}
]
keywords = ["cad", "automation", "cadquery", "freecad", "autocad", "solidworks", "fusion360", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: CAD",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
cadquery = ["cadquery>=2.0"]
freecad = []  # FreeCAD must be installed separately
windows = ["pywin32>=306"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
cad = "lib.cad_executor:app"
cadstack = "lib.cad_executor:app"

[project.urls]
Homepage = "https://github.com/WayneOuyang/cadstack"
Repository = "https://github.com/WayneOuyang/cadstack"
Issues = "https://github.com/WayneOuyang/cadstack/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*", "lib.backends*", "lib.utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_paths = ["lib"]
addopts = "-v --cov=lib --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
